<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit Review</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h2>Submit Bike Review</h2>

<div class="card p-4">

    <input type="number" id="bikeId" class="form-control mb-3" placeholder="Bike ID">

    <input type="number" id="reviewerId" class="form-control mb-3" placeholder="Reviewer ID">

    <input type="number" id="reviewedUserId" class="form-control mb-3" placeholder="Reviewed User ID">

    <select id="rating" class="form-control mb-3">
        <option value="1">⭐ 1</option>
        <option value="2">⭐⭐ 2</option>
        <option value="3">⭐⭐⭐ 3</option>
        <option value="4">⭐⭐⭐⭐ 4</option>
        <option value="5">⭐⭐⭐⭐⭐ 5</option>
    </select>

    <textarea id="comment" class="form-control mb-3" placeholder="Enter Comment"></textarea>

    <button class="btn btn-primary" onclick="submitReview()">Submit Review</button>
</div>

<script>

    async function submitReview() {

        const review = {
            bikeId: document.getElementById("bikeId").value,
            reviewerId: document.getElementById("reviewerId").value,
            reviewedUserId: document.getElementById("reviewedUserId").value,
            rating: document.getElementById("rating").value,
            comment: document.getElementById("comment").value
        };

        const response = await fetch("http://localhost:8080/reviews/add", {
            method: "POST",
            headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(review)
    });

    if(response.ok){
        alert("Review Submitted Successfully!");
    } else {
        alert("Error Submitting Review");
    }
}

</script>

</body>
</html>
