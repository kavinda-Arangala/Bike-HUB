<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Reviews</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h2>Bike Reviews</h2>

<input type="number" id="bikeId" class="form-control mb-3" placeholder="Enter Bike ID">

<button class="btn btn-success mb-4" onclick="loadReviews()">Load Reviews</button>

<div id="reviewsContainer"></div>

<script>

    async function loadReviews() {

        const bikeId = document.getElementById("bikeId").value;

        const response = await fetch(`http://localhost:8080/reviews/bike/${bikeId}`);

        const reviews = await response.json();

        let output = "";
         reviews.forEach(review => {

        output += `

        <div class="card mb-3 p-3">
            <h5>⭐ Rating: ${review.rating}</h5>
            <p>${review.comment}</p>
            <small>Reviewer ID: ${review.reviewerId}</small>
        </div>

        `;
    });

    document.getElementById("reviewsContainer").innerHTML = output;
}

</script>

</body>
</html>
