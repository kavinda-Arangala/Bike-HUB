<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – BikeHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --green:#2ECC71; --dark:#0F1923; --card:#1A2535; --text:#E8EDF2; --muted:#7A8FA6; --border:rgba(255,255,255,0.1); }
        body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--text);
               min-height: 100vh; display: flex; flex-direction: column; }
        nav { display:flex; justify-content:space-between; align-items:center;
              padding:1.2rem 3rem; border-bottom:1px solid var(--border); }
        .logo { font-family:'Syne',sans-serif; font-weight:800; font-size:1.4rem; color:var(--green); text-decoration:none; }
        .logo span { color:var(--text); }
        a.back { color:var(--muted); text-decoration:none; font-size:.9rem; }
        a.back:hover { color:var(--text); }

        .page { flex:1; display:flex; align-items:center; justify-content:center; padding:2rem; }
        .card { background:var(--card); border:1px solid var(--border); border-radius:20px;
                padding:2.5rem; width:100%; max-width:520px; }
        h2 { font-family:'Syne',sans-serif; font-size:1.8rem; margin-bottom:.3rem; }
        .sub { color:var(--muted); font-size:.93rem; margin-bottom:1.8rem; }

        .alert { padding:.75rem 1rem; border-radius:10px; font-size:.9rem; margin-bottom:1.2rem; }
        .alert-error   { background:rgba(231,76,60,.15); color:#e74c3c; border:1px solid rgba(231,76,60,.3); }
        .alert-success { background:rgba(46,204,113,.15); color:var(--green); border:1px solid rgba(46,204,113,.3); }

        .row { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
        .field { margin-bottom:1rem; }
        .field label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:.4rem; font-weight:500; }
        .field input, .field select {
            width:100%; padding:.7rem 1rem; border-radius:10px;
            background:rgba(255,255,255,0.05); border:1px solid var(--border);
            color:var(--text); font-family:'DM Sans',sans-serif; font-size:.95rem;
            transition:border-color .2s; outline:none;
        }
        .field input:focus, .field select:focus { border-color:var(--green); }
        .field select option { background:var(--card); }

        #licenseField { transition:all .3s; }

        .file-label { display:flex; align-items:center; gap:.6rem; padding:.7rem 1rem;
                      border-radius:10px; background:rgba(255,255,255,0.05);
                      border:1px solid var(--border); cursor:pointer; font-size:.93rem; color:var(--muted); }
        .file-label:hover { border-color:var(--green); }
        input[type="file"] { display:none; }
        #fileName { font-size:.82rem; color:var(--green); }

        .btn { width:100%; padding:.85rem; border-radius:10px; border:none;
               background:var(--green); color:var(--dark); font-family:'Syne',sans-serif;
               font-weight:700; font-size:1rem; cursor:pointer; margin-top:.5rem; transition:background .2s; }
        .btn:hover { background:#27b360; }
        .login-link { text-align:center; margin-top:1.2rem; color:var(--muted); font-size:.9rem; }
        .login-link a { color:var(--green); text-decoration:none; }
    </style>
</head>
<body>
<nav>
    <a th:href="@{/}" class="logo">Bike<span>Hub</span></a>
    <a th:href="@{/login}" class="back">← Back to Login</a>
</nav>

<div class="page">
    <div class="card">
        <h2>Create Account</h2>
        <p class="sub">Join BikeHub — rent, share, or list your bike.</p>

        <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <form th:action="@{/register}" method="post" enctype="multipart/form-data">
            <div class="row">
                <div class="field">
                    <label>Full Name</label>
                    <input type="text" name="name" placeholder="e.g. Kamal Perera" required>
                </div>
                <div class="field">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Choose a username" required>
                </div>
            </div>
            <div class="row">
                <div class="field">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="you@email.com" required>
                </div>
                <div class="field">
                    <label>Phone</label>
                    <input type="text" name="phone" placeholder="07X XXXXXXX">
                </div>
            </div>
            <div class="field">
                <label>Address</label>
                <input type="text" name="address" placeholder="City, Province">
            </div>
            <div class="row">
                <div class="field">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Min 6 characters" required>
                </div>
                <div class="field">
                    <label>Role</label>
                    <select name="role" id="roleSelect" onchange="toggleLicense(this.value)" required>
                        <option value="RENTER">🙋 Renter</option>
                        <option value="BIKE_OWNER">🚴 Bike Owner</option>
                    </select>
                </div>
            </div>
            <div class="field" id="licenseField">
                <label>Driving License Number</label>
                <input type="text" name="licenseNumber" placeholder="e.g. LK-1234567">
            </div>
            <div class="field">
                <label>Profile Photo</label>
                <label class="file-label" for="photoInput">
                    📷 Choose photo &nbsp;<span id="fileName">No file chosen</span>
                </label>
                <input type="file" id="photoInput" name="profilePhoto" accept="image/*"
                       onchange="document.getElementById('fileName').textContent = this.files[0]?.name || 'No file chosen'">
            </div>

            <button type="submit" class="btn">Create Account</button>
        </form>
        <p class="login-link">Already have an account? <a th:href="@{/login}">Login here</a></p>
    </div>
</div>

<script>
    function toggleLicense(role) {
        document.getElementById('licenseField').style.display =
            (role === 'RENTER' || role === 'BIKE_OWNER') ? 'block' : 'none';
    }
</script>
</body>
</html>
