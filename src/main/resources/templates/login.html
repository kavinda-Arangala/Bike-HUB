<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – BikeHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
        :root { --green:#2ECC71; --dark:#0F1923; --card:#1A2535; --text:#E8EDF2; --muted:#7A8FA6; --border:rgba(255,255,255,0.1); }
        body { font-family:'DM Sans',sans-serif; background:var(--dark); color:var(--text);
               min-height:100vh; display:flex; flex-direction:column; }
        nav { display:flex; justify-content:space-between; align-items:center;
              padding:1.2rem 3rem; border-bottom:1px solid var(--border); }
        .logo { font-family:'Syne',sans-serif; font-weight:800; font-size:1.4rem; color:var(--green); text-decoration:none; }
        .logo span { color:var(--text); }
        a.back { color:var(--muted); font-size:.9rem; text-decoration:none; }
        a.back:hover { color:var(--text); }

        .page { flex:1; display:flex; align-items:center; justify-content:center; padding:2rem; }
        .card { background:var(--card); border:1px solid var(--border); border-radius:20px;
                padding:2.5rem; width:100%; max-width:420px; }
        h2 { font-family:'Syne',sans-serif; font-size:1.8rem; margin-bottom:.3rem; }
        .sub { color:var(--muted); font-size:.93rem; margin-bottom:1.8rem; }

        .alert { padding:.75rem 1rem; border-radius:10px; font-size:.9rem; margin-bottom:1.2rem; }
        .alert-error   { background:rgba(231,76,60,.15); color:#e74c3c; border:1px solid rgba(231,76,60,.3); }
        .alert-success { background:rgba(46,204,113,.15); color:var(--green); border:1px solid rgba(46,204,113,.3); }

        .field { margin-bottom:1.1rem; }
        .field label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:.4rem; font-weight:500; }
        .field input {
            width:100%; padding:.75rem 1rem; border-radius:10px;
            background:rgba(255,255,255,0.05); border:1px solid var(--border);
            color:var(--text); font-family:'DM Sans',sans-serif; font-size:.95rem;
            outline:none; transition:border-color .2s;
        }
        .field input:focus { border-color:var(--green); }

        .btn { width:100%; padding:.85rem; border-radius:10px; border:none;
               background:var(--green); color:var(--dark); font-family:'Syne',sans-serif;
               font-weight:700; font-size:1rem; cursor:pointer; margin-top:.5rem; transition:background .2s; }
        .btn:hover { background:#27b360; }
        .register-link { text-align:center; margin-top:1.2rem; color:var(--muted); font-size:.9rem; }
        .register-link a { color:var(--green); text-decoration:none; }

        .roles-hint { display:flex; gap:.6rem; margin-bottom:1.5rem; }
        .pill { background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:100px;
                padding:.3rem .8rem; font-size:.78rem; color:var(--muted); }
    </style>
</head>
<body>
<nav>
    <a th:href="@{/}" class="logo">Bike<span>Hub</span></a>
    <a th:href="@{/}" class="back">← Home</a>
</nav>

<div class="page">
    <div class="card">
        <h2>Welcome Back</h2>
        <p class="sub">Login to your BikeHub account</p>

        <div class="roles-hint">
            <span class="pill">🙋 Renter</span>
            <span class="pill">🚴 Bike Owner</span>
            <span class="pill">🛡️ Admin</span>
        </div>

        <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <form th:action="@{/login}" method="post">
            <div class="field">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username" required autofocus>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>
        <p class="register-link">No account yet? <a th:href="@{/register}">Register here</a></p>
    </div>
</div>
</body>
</html>
