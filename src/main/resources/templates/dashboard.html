<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – BikeHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root { --green:#2ECC71; --dark:#0F1923; --card:#1A2535; --text:#E8EDF2; --muted:#7A8FA6; --border:rgba(255,255,255,0.1); --accent:#F0C040; }
    body { font-family:'DM Sans',sans-serif; background:var(--dark); color:var(--text); min-height:100vh; }

    nav { display:flex; justify-content:space-between; align-items:center;
          padding:1.1rem 2.5rem; border-bottom:1px solid var(--border); position:sticky; top:0;
          background:var(--dark); z-index:10; }
    .logo { font-family:'Syne',sans-serif; font-weight:800; font-size:1.4rem; color:var(--green); }
    .logo span { color:var(--text); }
    .nav-right { display:flex; align-items:center; gap:1rem; }
    .nav-right a { color:var(--muted); text-decoration:none; font-size:.9rem; transition:color .2s; }
    .nav-right a:hover { color:var(--text); }
    .btn { padding:.5rem 1.2rem; border-radius:8px; text-decoration:none; font-size:.9rem;
           font-weight:500; border:none; cursor:pointer; transition:all .2s; }
    .btn-green  { background:var(--green); color:var(--dark); }
    .btn-green:hover { background:#27b360; }
    .btn-red    { background:rgba(231,76,60,.15); color:#e74c3c; border:1px solid rgba(231,76,60,.3); }
    .btn-red:hover { background:rgba(231,76,60,.25); }

    .container { max-width:900px; margin:0 auto; padding:2.5rem 1.5rem; }
    .alert { padding:.75rem 1rem; border-radius:10px; font-size:.9rem; margin-bottom:1.5rem;
             background:rgba(46,204,113,.15); color:var(--green); border:1px solid rgba(46,204,113,.3); }

    .profile-top { display:flex; align-items:center; gap:1.5rem; margin-bottom:2rem; }
    .avatar { width:80px; height:80px; border-radius:50%; background:linear-gradient(135deg,var(--green),#0d9e50);
              display:flex; align-items:center; justify-content:center; font-size:2rem;
              flex-shrink:0; overflow:hidden; border:3px solid rgba(46,204,113,.3); }
    .avatar img { width:100%; height:100%; object-fit:cover; }
    .profile-info h2 { font-family:'Syne',sans-serif; font-size:1.6rem; }
    .role-badge { display:inline-block; padding:.25rem .75rem; border-radius:100px; font-size:.78rem;
                  font-weight:600; margin-top:.3rem; }
    .role-RENTER     { background:rgba(46,204,113,.15);  color:var(--green); }
    .role-BIKE_OWNER { background:rgba(240,192,64,.15);  color:var(--accent); }
    .role-ADMIN      { background:rgba(231,76,60,.15);   color:#e74c3c; }

    .cards-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:1rem; margin-bottom:2rem; }
    .info-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:1.5rem; }
    .info-card h4 { font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:.8rem; }
    .info-row { display:flex; justify-content:space-between; align-items:center;
                padding:.55rem 0; border-bottom:1px solid var(--border); font-size:.93rem; }
    .info-row:last-child { border-bottom:none; }
    .info-row span:first-child { color:var(--muted); }
    .info-row span:last-child  { color:var(--text); font-weight:500; }

    .actions { display:flex; gap:.8rem; margin-top:1.5rem; }
  </style>
</head>
<body>
<nav>
  <div class="logo">Bike<span>Hub</span></div>
  <div class="nav-right">
    <a th:href="@{/edit}">✏️ Edit Profile</a>
    <a th:href="@{/logout}" class="btn btn-red">Logout</a>
  </div>
</nav>

<div class="container">
  <div th:if="${success}" class="alert" th:text="${success}"></div>

  <div class="profile-top">
    <div class="avatar">
      <img th:if="${user.profilePhoto != null and user.profilePhoto != 'default.png'}"
           th:src="@{'/uploads/' + ${user.profilePhoto}}" alt="Profile">
      <span th:if="${user.profilePhoto == null or user.profilePhoto == 'default.png'}"
            th:text="${#strings.substring(user.name, 0, 1)}"></span>
    </div>
    <div class="profile-info">
      <h2 th:text="${user.name}">User Name</h2>
      <span class="role-badge"
            th:classappend="'role-' + ${user.role}"
            th:text="${user.role == 'BIKE_OWNER' ? '🚴 Bike Owner' : (user.role == 'ADMIN' ? '🛡️ Admin' : '🙋 Renter')}">
            </span>
    </div>
  </div>

  <div class="cards-grid">
    <div class="info-card">
      <h4>Account Info</h4>
      <div class="info-row"><span>Username</span>  <span th:text="${user.username}"></span></div>
      <div class="info-row"><span>Email</span>     <span th:text="${user.email}"></span></div>
      <div class="info-row"><span>User ID</span>   <span th:text="${user.id}"></span></div>
    </div>
    <div class="info-card">
      <h4>Contact Details</h4>
      <div class="info-row"><span>Phone</span>   <span th:text="${user.phone}"></span></div>
      <div class="info-row"><span>Address</span> <span th:text="${user.address}"></span></div>
    </div>
  </div>

  <div class="actions">
    <a th:href="@{/edit}" class="btn btn-green">✏️ Edit Profile</a>
    <a th:href="@{/logout}" class="btn btn-red">🚪 Logout</a>
  </div>
</div>
</body>
</html>
