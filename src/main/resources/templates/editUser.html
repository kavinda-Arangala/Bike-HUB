<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile – BikeHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
        :root { --green:#2ECC71; --dark:#0F1923; --card:#1A2535; --text:#E8EDF2; --muted:#7A8FA6; --border:rgba(255,255,255,0.1); }
        body { font-family:'DM Sans',sans-serif; background:var(--dark); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
        nav { display:flex; justify-content:space-between; align-items:center;
              padding:1.1rem 2.5rem; border-bottom:1px solid var(--border); }
        .logo { font-family:'Syne',sans-serif; font-weight:800; font-size:1.4rem; color:var(--green); text-decoration:none; }
        .logo span { color:var(--text); }
        a.back { color:var(--muted); text-decoration:none; font-size:.9rem; }
        a.back:hover { color:var(--text); }
        .page { flex:1; display:flex; align-items:center; justify-content:center; padding:2rem; }
        .card { background:var(--card); border:1px solid var(--border); border-radius:20px;
                padding:2.5rem; width:100%; max-width:520px; }
        h2 { font-family:'Syne',sans-serif; font-size:1.8rem; margin-bottom:.3rem; }
        .sub { color:var(--muted); font-size:.93rem; margin-bottom:1.8rem; }
        .row { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
        .field { margin-bottom:1rem; }
        .field label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:.4rem; font-weight:500; }
        .field input {
            width:100%; padding:.7rem 1rem; border-radius:10px;
            background:rgba(255,255,255,0.05); border:1px solid var(--border);
            color:var(--text); font-family:'DM Sans',sans-serif; font-size:.95rem;
            outline:none; transition:border-color .2s;
        }
        .field input:focus { border-color:var(--green); }
        .field input:disabled { opacity:.45; cursor:not-allowed; }
        .hint { font-size:.78rem; color:var(--muted); margin-top:.3rem; }
        .file-label { display:flex; align-items:center; gap:.6rem; padding:.7rem 1rem;
                      border-radius:10px; background:rgba(255,255,255,0.05);
                      border:1px solid var(--border); cursor:pointer; font-size:.93rem; color:var(--muted); }
        .file-label:hover { border-color:var(--green); }
        input[type="file"] { display:none; }
        #fileName { font-size:.82rem; color:var(--green); }
        .btn-row { display:flex; gap:.8rem; margin-top:.5rem; }
        .btn { flex:1; padding:.85rem; border-radius:10px; border:none;
               font-family:'Syne',sans-serif; font-weight:700; font-size:.95rem;
               cursor:pointer; text-align:center; text-decoration:none; transition:all .2s; display:block; }
        .btn-green   { background:var(--green); color:var(--dark); }
        .btn-green:hover { background:#27b360; }
        .btn-outline { background:transparent; border:1.5px solid var(--border); color:var(--muted); }
        .btn-outline:hover { border-color:var(--green); color:var(--green); }
    </style>
</head>
<body>
<nav>
    <a th:href="@{/}" class="logo">Bike<span>Hub</span></a>
    <a href="javascript:history.back()" class="back">← Back</a>
</nav>

<div class="page">
    <div class="card">
        <h2>Edit Profile</h2>
        <p class="sub">Updating: <strong th:text="${editUser.username}"></strong></p>

        <form th:action="@{/update}" method="post" enctype="multipart/form-data">
            <input type="hidden" name="id" th:value="${editUser.id}">

            <div class="row">
                <div class="field">
                    <label>Full Name</label>
                    <input type="text" name="name" th:value="${editUser.name}" required>
                </div>
                <div class="field">
                    <label>Username</label>
                    <input type="text" th:value="${editUser.username}" disabled>
                    <p class="hint">Username cannot be changed.</p>
                </div>
            </div>
            <div class="row">
                <div class="field">
                    <label>Email</label>
                    <input type="email" name="email" th:value="${editUser.email}" required>
                </div>
                <div class="field">
                    <label>Phone</label>
                    <input type="text" name="phone" th:value="${editUser.phone}">
                </div>
            </div>
            <div class="field">
                <label>Address</label>
                <input type="text" name="address" th:value="${editUser.address}">
            </div>
            <div class="field">
                <label>New Password</label>
                <input type="password" name="password" placeholder="Leave blank to keep current">
            </div>
            <div class="field" th:if="${editUser.role == 'RENTER' or editUser.role == 'BIKE_OWNER'}">
                <label>License Number</label>
                <input type="text" name="licenseNumber"
                       th:value="${editUser instanceof T(lk.ac.sliit.Bike_Rental_and_Ride_SSharing_System.model.RegularUser) ? editUser.licenseNumber : ''}">
            </div>
            <div class="field">
                <label>Profile Photo</label>
                <label class="file-label" for="photoInput">
                    📷 Choose new photo &nbsp;<span id="fileName">No file chosen</span>
                </label>
                <input type="file" id="photoInput" name="profilePhoto" accept="image/*"
                       onchange="document.getElementById('fileName').textContent = this.files[0]?.name || 'No file chosen'">
            </div>

            <div class="btn-row">
                <button type="submit" class="btn btn-green">💾 Save Changes</button>
                <a href="javascript:history.back()" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
