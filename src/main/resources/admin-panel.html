<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Review Moderation Panel</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

<h2 class="mb-4">Admin Review Moderation Panel</h2>
<!-- Input field for Review ID -->
<input type="number"
       id="reviewId"
       class="form-control mb-3"
       placeholder="Enter Review ID to Delete">

<!-- Delete button -->
<button class="btn btn-danger"
        onclick="deleteReview()">
    Delete Review
</button>

<script>

    // Function for deleting reviews
    async function deleteReview() {

        // Get review ID from input field
        const reviewId = document.getElementById("reviewId").value;

        // Send DELETE request to backend
        const response = await fetch(`http://localhost:8080/reviews/${reviewId}`, {

            method: "DELETE"

        });

        // Get response text from backend
        const result = await response.text();

        // Show alert message
        alert(result);
    }

</script>

</body>

</html>
